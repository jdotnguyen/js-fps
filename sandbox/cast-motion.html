<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cast motion sandbox (per-character-motion)</title>
    <style>
      html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;font:12px system-ui,sans-serif;color:#d8dde3}
      #game{width:100%;height:100%;display:block}
      #panel{position:fixed;top:8px;left:8px;background:#000a;padding:8px 10px;border-radius:6px;display:flex;flex-direction:column;gap:6px;max-width:330px}
      #panel label{display:flex;gap:6px;align-items:center}
      #panel select,#panel button,#panel input{font:inherit}
      .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="panel"></div>
    <script type="module" src="/src/sandbox/castMotionSandbox.ts"></script>
  </body>
</html>
