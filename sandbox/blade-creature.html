<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blade creature (rig-necromorph)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #15181c; font: 12px/1.4 monospace; color: #d8dde3; }
      #game { width: 100%; height: 100%; display: block; }
      #panel { position: absolute; top: 8px; left: 8px; width: 290px; max-height: calc(100% - 16px); overflow: auto; background: #0b0d10e0; padding: 8px 10px; border: 1px solid #333a44; }
      #panel h3 { margin: 8px 0 4px; font-size: 12px; color: #9fd3ff; }
      #panel label { display: block; margin: 2px 0; }
      #panel select, #panel input[type='text'] { width: 100%; box-sizing: border-box; background: #1c2128; color: inherit; border: 1px solid #3a4450; }
      #panel button { background: #26303b; color: inherit; border: 1px solid #3a4450; margin: 2px 2px 2px 0; padding: 2px 6px; cursor: pointer; }
      #panel button.on { background: #2f5d7c; }
      #readout { white-space: pre; color: #a9b4bf; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="panel"></div>
    <script type="module" src="/src/sandbox/bladeCreatureSandbox.ts"></script>
  </body>
</html>
