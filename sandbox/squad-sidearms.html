<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squad sidearms sandbox (squad-sidearms)</title>
    <style>
      html,body{margin:0;height:100%;overflow:hidden;background:#07080a;font:12px system-ui,sans-serif;color:#d8dde3}
      #game{width:100%;height:100%;display:block}
      #panel{position:fixed;top:8px;left:8px;background:#000c;padding:8px 10px;border-radius:6px;display:flex;flex-direction:column;gap:6px;width:330px;max-height:calc(100% - 16px);overflow:auto}
      #panel label{display:flex;gap:6px;align-items:center}
      #panel select,#panel button,#panel input{font:inherit}
      #panel b{font-size:13px}
      #panel h4{margin:6px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a96a3}
      .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
      #readout{font:11px ui-monospace,monospace;white-space:pre;color:#b9c4cf;background:#0008;padding:6px;border-radius:4px}
      #hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:#000a;padding:6px 10px;border-radius:6px}
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="panel"></div>
    <div id="hint">Click the page once to turn the sound on. Click the view to look, WASD to fly, Space/C up and down. Keys: 1 Giles, 2 Okafor, 3 both, F auto-fire, J Jay's shot.</div>
    <script type="module" src="/src/sandbox/squadSidearmsSandbox.ts"></script>
  </body>
</html>
