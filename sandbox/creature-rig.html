<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creature rig (openspec rig-juggernaut)</title>
    <style>
      html,body{margin:0;height:100%;overflow:hidden;background:#15181d;color:#d8dde4;font:12px/1.4 ui-monospace,Consolas,monospace}
      #game{width:100%;height:100%;display:block}
      #panel{position:fixed;top:8px;right:8px;width:300px;max-height:calc(100% - 16px);overflow:auto;background:rgba(12,14,18,.88);border:1px solid #2b313a;border-radius:6px;padding:8px 10px}
      #panel h3{margin:10px 0 4px;font-size:12px;color:#9fb3c8;text-transform:uppercase;letter-spacing:.05em}
      #panel h3:first-child{margin-top:0}
      #panel label{display:flex;align-items:center;gap:6px;margin:2px 0}
      #panel input[type=range]{flex:1}
      #panel select,#panel button,#panel input[type=number]{background:#20252d;color:#d8dde4;border:1px solid #3a424e;border-radius:3px;padding:2px 4px;font:inherit}
      #panel .row{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}
      #readout{white-space:pre;position:fixed;left:8px;bottom:8px;background:rgba(12,14,18,.85);border:1px solid #2b313a;border-radius:6px;padding:6px 8px;max-height:45%;overflow:auto}
      #help{position:fixed;left:8px;top:8px;background:rgba(12,14,18,.7);padding:4px 8px;border-radius:4px}
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="help">Drag to orbit, right-drag to pan, wheel to zoom. Pick a handle in "Drag" and move it with the gizmo.</div>
    <div id="panel"></div>
    <div id="readout"></div>
    <script type="module" src="/src/sandbox/creatureRigSandbox.ts"></script>
  </body>
</html>
