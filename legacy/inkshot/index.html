<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INKSHOT</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="crosshair"></div>
      <div id="hitmarker"></div>
      <div id="vignette"></div>
      <div id="message"></div>
      <div class="hud-box top-left">
        <div class="label">WAVE</div>
        <div class="value" id="wave">1</div>
      </div>
      <div class="hud-box top-right">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="hud-box bottom-left">
        <div class="label">HEALTH</div>
        <div id="health-bar"><div id="health-fill"></div></div>
      </div>
      <div class="hud-box bottom-right">
        <div class="label" id="weapon-name">RIFLE</div>
        <div class="value" id="ammo">30 / 30</div>
      </div>
    </div>

    <div id="overlay">
      <div class="panel">
        <h1 id="overlay-title">INKSHOT</h1>
        <p id="overlay-sub">Survive the waves.</p>
        <button id="play" type="button">PLAY</button>
        <ul class="controls">
          <li><b>WASD</b> move</li>
          <li><b>Mouse</b> aim</li>
          <li><b>Click</b> fire</li>
          <li><b>Space</b> jump</li>
          <li><b>Shift</b> sprint</li>
          <li><b>R</b> reload</li>
          <li><b>1 / 2</b> weapons</li>
          <li><b>Esc</b> pause</li>
        </ul>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
